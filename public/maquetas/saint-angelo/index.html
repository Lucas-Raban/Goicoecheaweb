<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saint Angelo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(8,22,38,.80);--azul:#0d233c;--noche:#081626;--ink:#f4f5f7;--muted:#9fb0c3;--line:rgba(255,255,255,.13);--ok:#34c77b;--no:#e5484d;--sel:#f5d27a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9e6e1;color:var(--ink);font:14px/1.45 Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.28)}
#side{position:fixed;top:16px;left:16px;bottom:16px;width:320px;padding:18px;display:flex;flex-direction:column;gap:12px;z-index:3;overflow:auto}
.logo{display:block;width:150px;height:auto;margin-bottom:12px;opacity:.95}.etq{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{margin:3px 0 0;font:800 27px/1.1 Manrope,system-ui;letter-spacing:-.015em}
.addr{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.floors{display:grid;grid-template-columns:38px 1fr 1fr;gap:5px;align-items:center}
.floors .n{font-size:11px;color:var(--muted);text-align:right;padding-right:4px}
.u{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:9px;padding:8px 6px;font:inherit;font-size:12px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s,opacity .15s}
.u::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 6px 0 2px;vertical-align:1px;background:var(--no)}
.u.ok::before{background:var(--ok)}
.u.ok{border-color:rgba(52,199,123,.45);background:rgba(52,199,123,.12)}
.u.dim{opacity:.35}
.u[aria-pressed="true"]{border-color:var(--sel);background:rgba(245,210,122,.18)}
.card{border-top:1px solid var(--line);padding-top:12px;display:none}
.card .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card b{display:block;font:800 21px/1.2 Manrope,system-ui;margin:2px 0}
.card .meta{color:var(--muted);font-size:13px}
.card .price{font:800 24px/1.2 Manrope,system-ui;margin-top:8px}
.card .price.no{font-size:15px;color:var(--muted);font-weight:500}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#25d366;color:#06240f;text-decoration:none;font-weight:600;border-radius:10px;padding:9px 12px;font-size:13px}
#tools{position:fixed;top:16px;right:16px;z-index:3;display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 370px)}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;padding:8px 11px;border-radius:10px;cursor:pointer}
.tb[aria-pressed="true"]{background:rgba(255,255,255,.16)}
#tip{position:fixed;z-index:4;pointer-events:none;padding:7px 10px;font-size:12px;display:none;white-space:nowrap}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;background:#0d233c;color:#c9d4e0;font-size:13px;letter-spacing:.08em;transition:opacity .9s}#loading img{width:220px}#loading .bar{width:140px;height:2px;background:rgba(255,255,255,.15);overflow:hidden;border-radius:2px}#loading .bar i{display:block;height:100%;width:40%;background:#fff;animation:ld 1.1s ease-in-out infinite}@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}#side,#tools,.hint{transition:opacity .9s,transform .9s}body.intro #side{opacity:0;transform:translateX(-24px)}body.intro #tools,body.intro .hint{opacity:0;transform:translateY(-12px)}#hero{position:fixed;left:0;right:0;bottom:12%;z-index:4;text-align:center;color:#fff;pointer-events:none;opacity:0;transition:opacity 1.2s;text-shadow:0 2px 24px rgba(0,0,0,.35)}#hero.on{opacity:1}#hero .etq{color:#e8eef5}#hero b{display:block;font:800 clamp(34px,6vw,64px)/1.05 Manrope,system-ui;letter-spacing:-.02em;margin:6px 0}#hero span{font-size:15px}#skip{position:fixed;right:16px;bottom:16px;z-index:6;border:1px solid rgba(255,255,255,.4);background:rgba(8,22,38,.5);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}body:not(.intro) #skip{display:none}
.hint{position:fixed;right:16px;bottom:16px;z-index:3;font-size:12px;color:var(--muted);padding:8px 12px}
#toggle{display:none}
@media (max-width:760px){
  #side{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:46%;padding:14px}
  #tools{left:8px;right:8px;top:8px;max-width:none;justify-content:center}
  .hint{display:none}h1{font-size:20px}.logo{width:110px;margin-bottom:8px}.tb{font-size:11.5px;padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cta.in{background:#fff;color:#111}
#tour{position:fixed;inset:0;z-index:10;background:#05080b;display:none;flex-direction:column;opacity:0;transition:opacity .5s}
#tour.on{display:flex}#tour.vis{opacity:1}
#tour .stage{position:relative;flex:1;overflow:hidden;min-height:0}
#tour .stage img,#tour .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#tour .stage #tBg{object-fit:cover;filter:blur(28px) brightness(.55);transform:scale(1.15)}
#tour .stage img{transition:opacity .45s}#tour .stage img.kb{animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
#tour .stage video{object-fit:contain;background:#000}
#tour .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 40px;background:linear-gradient(#000a,#0000);pointer-events:none}
#tour .bar>*{pointer-events:auto}
#tour .ttl .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9d3da}#tour .ttl b{display:block;font:800 22px/1.2 Manrope,system-ui}
#tour .ttl span{font-size:12px;color:#c9d3da}
#tour .tbtn{border:1px solid rgba(255,255,255,.3);background:rgba(10,14,18,.6);color:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
#tour .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#tour .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(10,14,18,.55);color:#fff;font-size:22px;cursor:pointer}
#tour .prev{left:14px}#tour .next{right:14px}#tour .nav.lbl{width:auto;height:auto;padding:10px 16px;border-radius:999px;font:600 13px/1.2 Montserrat,system-ui;display:flex;align-items:center;gap:8px;max-width:42vw;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}#tour .nav.lbl em{font-style:normal;font-size:20px;line-height:1}#tour .nav.lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tour .nav.lbl small{display:block;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:.7}#tMap{position:absolute;left:14px;bottom:14px;z-index:2;padding:10px 10px 8px;border-radius:14px;background:rgba(8,22,38,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);color:#dfe7ef;font-size:10px;letter-spacing:.06em}#tMap[hidden]{display:none}#tMap svg{display:block;height:210px;width:auto}#tMap .cap{text-align:center;opacity:.65;margin-top:4px}#tMap .dot{cursor:pointer}#tMap .dot circle{fill:#fff;opacity:.55;transition:opacity .2s}#tMap .dot circle.hit{fill:transparent;opacity:1}#tMap .dot:hover circle{opacity:1}#tMap .dot.cur circle{fill:#f5d27a;opacity:1}#tMap .pulse{fill:none;stroke:#f5d27a;stroke-width:.12;animation:pl 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}@media (max-width:760px){#tMap svg{height:120px}#tMap{left:8px;bottom:8px;padding:6px}#tour .nav.lbl{padding:8px 10px;font-size:12px;max-width:40vw}#tour .nav.lbl small{display:none}#tour .b360{left:auto;right:8px;bottom:12px;transform:none;font-size:11px;padding:6px 10px}}
#tour .strip{display:flex;gap:8px;overflow-x:auto;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#0b1015;scrollbar-width:thin}
#tour .strip button{flex:0 0 auto;width:108px;border:2px solid transparent;border-radius:10px;padding:0;background:none;color:#cfd8de;font:inherit;font-size:11px;cursor:pointer;text-align:left;overflow:hidden}
#tour .strip button[aria-current="true"]{border-color:var(--sel)}
#tour .strip img{display:block;width:100%;height:64px;object-fit:cover}#tour .strip span{display:block;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tPano{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;cursor:grab}#tPano.on{display:block}#tPano:active{cursor:grabbing}
#tour .b360{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(10,14,18,.6);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;pointer-events:none;backdrop-filter:blur(8px);white-space:nowrap;transition:opacity .6s}
#fade{position:fixed;inset:0;z-index:9;background:#05080b;opacity:0;pointer-events:none;transition:opacity .45s}
@media (max-width:760px){#tour .ttl b{font-size:18px}#tour .nav{width:38px;height:38px}#tour .strip button{width:90px}}
@media (prefers-reduced-motion:reduce){#tour .stage img.kb{animation:none}}

/* ---------- UI ---------- */
function renderUI(){
  const ambs=[...new Set(UNITS.map(u=>u.amb))].sort();
  $("filters").innerHTML=`<button class="chip" data-amb="all" aria-pressed="${S.amb==="all"}">Todos</button>`+ambs.map(a=>`<button class="chip" data-amb="${a}" aria-pressed="${S.amb==a}">${a} amb</button>`).join("")+`<button class="chip" data-ok="1" aria-pressed="${S.onlyOk}">Solo disponibles</button>`;
  let h="";for(let f=9;f>=1;f--){h+=`<span class="n">${"Piso "+f}</span>`;for(const l of["A","B"]){const u=UNITS.find(x=>x.floor===f&&x.l===l);h+=`<button class="u ${u.ok?"ok":""} ${match(u)?"":"dim"}" data-u="${u.id}" aria-pressed="${S.sel===u.id}">${u.id} · ${u.amb} amb</button>`}}

}

Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:420});sun.target.position.set(0,0,12);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;

  const az=THREE.MathUtils.degToRad(sunset?-62:38),el=THREE.MathUtils.degToRad(sunset?8:27);

  skyU.sunDir.value.copy(sun.position).sub(sun.target.position).normalize();
  sun.color.set(sunset?"#ff9a55":"#ffe1b8");sun.intensity=sunset?2.1:1.75;hemi.intensity=sunset?.26:.4;hemi.color.set(sunset?"#ffcfa8":"#dfe8f5");
  skyU.top.value.set(sunset?"#34497c":"#5a8fca");skyU.mid.value.set(sunset?"#f0a873":"#dfe7ee");skyU.bot.value.set(sunset?"#e9c3a3":"#e7e2da");skyU.sunCol.value.set(sunset?"#ffb070":"#fff0d6");
  scene.fog.color.set(sunset?"#eec2a0":"#e6e2db");if(window.lampMat)lampMat.emissiveIntensity=sunset?2.2:.5;R.toneMappingExposure=sunset?.86:.82;

const T={u:null,i:0,set:null,vid:null,on:false};
function enterUnit(u){if(!u)return;$("tVid").hidden=false;T.u=u;T.set=FOTOS[u.floor===9?"D":u.l];T.i=0;
  const x=u.l==="A"?2.4:-2.4,y=base(u.floor)+1.5;stopRot();
  go([x,y+.4,FZ+4.5],[x,y,FZ-4],1100);
  setTimeout(()=>{$("fade").style.opacity=1},750);
  setTimeout(()=>{openTour();$("fade").style.opacity=0},1250)}
function openTour(){T.on=true;const t=$("tour");t.classList.add("on");requestAnimationFrame(()=>t.classList.add("vis"));
  $("tStrip").innerHTML=T.set.f.map(([k,c],i)=>`<button data-i="${i}"><img src="${T.set.pano?"img/360/"+k+"-s.jpg":"img/int/"+k+".jpg"}" alt="" loading="lazy"><span>${c}</span></button>`).join("");showPhoto(0)}
function showPhoto(i){stopVid();const n=T.set.f.length;T.i=(i+n)%n;const [k,c]=T.set.f[T.i],u=T.u,img=$("tImg");
  const P=!!T.set.pano;$("tPano").classList.toggle("on",P);img.style.display=$("tBg").style.display=P?"none":"";$("tHint").hidden=!P;
  if(P){loadPano(k,T.set.f[T.i][2])}else{img.style.opacity=0;const nu=new Image();nu.onload=()=>{img.src=nu.src;$("tBg").src=nu.src;img.alt=c;img.classList.remove("kb");void img.offsetWidth;img.classList.add("kb");img.style.opacity=1};nu.src=`img/int/${k}.jpg`;}
  $("tTtl").innerHTML=!u?`<div class="k">Saint Angelo</div><b>${T.set.title} · ${c}</b><span>Foto 360° real · ${T.i+1} de ${n}</span>`:`<div class="k">Saint Angelo · Piso ${u.floor}</div><b>Depto ${u.id} · ${c}</b><span>${T.set.pano?"Foto 360° real de un "+(u.floor===9?"dúplex":(u.l==="A"?"3":"2")+" ambientes")+" del edificio":u.id==="9A"?"Fotos reales del 9A":"Fotos reales de un departamento de la misma tipología ("+(u.floor===9?"dúplex de 4 ambientes":u.amb+" ambientes")+")"} · ${T.i+1} de ${n}</span>`;
  const nm=j=>T.set.f[(j+n)%n][1].replace(/,.*$/,"").replace(/ \(planta alta\)/,"");
  $("tPrev").innerHTML=`<em>‹</em><span><small>Anterior</small>${nm(T.i-1)}</span>`;$("tNext").innerHTML=`<span style="text-align:right"><small>Siguiente</small>${nm(T.i+1)}</span><em>›</em>`;
  drawMap();
  $("tStrip").querySelectorAll("button").forEach((b,j)=>{b.setAttribute("aria-current",j===T.i);if(j===T.i)b.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"})})}
function stopVid(){if(T.vid){T.vid.pause();T.vid.remove();T.vid=null;$("tVid").textContent="▶ Video del recorrido"}}
$("tVid").onclick=()=>{if(T.vid)return stopVid();const v=document.createElement("video");v.src=T.set.v;v.controls=true;v.autoplay=true;v.playsInline=true;v.muted=true;$("tStage").insertBefore(v,$("tPrev"));T.vid=v;$("tVid").textContent="✕ Cerrar video"};
$("tPrev").onclick=()=>showPhoto(T.i-1);$("tNext").onclick=()=>showPhoto(T.i+1);
$("tStrip").onclick=e=>{const b=e.target.closest("button");if(b)showPhoto(+b.dataset.i)};
function closeTour(){stopVid();const t=$("tour");t.classList.remove("vis");setTimeout(()=>{t.classList.remove("on");T.on=false;$("tPano").classList.remove("on")},500);if(T.u)focusUnit(T.u)}
function enterPlace(key){T.u=null;T.set=FOTOS[key];T.i=0;stopRot();$("tVid").hidden=true;$("fade").style.opacity=1;setTimeout(()=>{openTour();$("fade").style.opacity=0},450)}
document.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>enterPlace(b.dataset.place));
$("tOut").onclick=closeTour;
addEventListener("keydown",e=>{if(!$("tour").classList.contains("on"))return;if(e.key==="Escape")closeTour();else if(e.key==="ArrowRight")showPhoto(T.i+1);else if(e.key==="ArrowLeft")showPhoto(T.i-1)});
{let sx=null;$("tStage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});$("tStage").addEventListener("touchend",e=>{if(sx==null||T.vid)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)showPhoto(T.i+(d<0?1:-1));sx=null})}

/* ---------- mini plano del recorrido (esquema orientativo sobre la planta real del semipiso) ---------- */
// fy: profundidad 0 frente → 1 contrafrente (<0 balcón al frente, >1 balcón contrafrente) · dx: -1 medianera … 1 lado del palier · lv: 1 = planta alta del dúplex
const ZN={balcon:[-.07,0],living:[.1,0],living2:[.2,-.4],living3:[.3,.35],entrada:[.4,.6],cocina:[.4,-.5],lavadero:[.52,-.4],pasillo:[.62,.1],toilette:[.58,.55],
  dorm:[.84,-.2],dorm1:[.86,-.35],dorm2:[.74,.35],bano:[.7,.5],bano1:[.78,.55],bano2:[.7,-.45],vestidor:[.9,.45],balcon2:[1.05,0],escalera:[.62,.45],
  "d:escalera2":[.62,.45,1],"d:alta":[.3,0,1],"d:vestidor":[.55,-.3,1],"d:bano2":[.72,.3,1],"d:terraza":[-.07,0,1]};
function mapPos(k){const set=k[0],r=k.slice(2);return ZN[set+":"+r]||ZN[r]||ZN[r.replace(/\d$/,"")]||[.5,0]}
function spanAt(poly,y){const xs=[];for(let i=0;i<poly.length;i++){const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%poly.length];if((y1<=y&&y2>y)||(y2<=y&&y1>y))xs.push(x1+(y-y1)/(y2-y1)*(x2-x1))}xs.sort((a,b)=>a-b);return xs.length?[xs[0],xs[xs.length-1]]:[0,0]}
function drawMap(){const m=$("tMap");if(!T.u){m.hidden=true;return}m.hidden=false;
  const l=T.u.l,poly=OUT[l],duplex=T.set===FOTOS.D,xs=poly.map(p=>p[0]),x0=Math.min(...xs),x1=Math.max(...xs),w=x1-x0,gap=1.6,lvls=duplex?2:1;
  const inner=l==="A"?1:-1; // el palier queda hacia x=5.09
  const vb=`${x0-1.6} -3.6 ${w*lvls+gap*(lvls-1)+3.2} ${D+8}`;let g="";
  for(let lv=0;lv<lvls;lv++){const ox=lv*(w+gap),pts=poly.map(([x,y])=>`${x+ox},${y}`).join(" ");
    g+=`<polygon points="${pts}" fill="rgba(255,255,255,.07)" stroke="#fff" stroke-width=".14" stroke-opacity=".8"/>`;
    const fs=spanAt(poly,.01),bs=spanAt(poly,D-.01);
    g+=`<rect x="${fs[0]+.5+ox}" y="-1.87" width="${fs[1]-fs[0]-1}" height="1.87" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".1" stroke-dasharray=".3 .25"/>`;
    g+=`<rect x="${bs[0]+.6+ox}" y="${D}" width="${bs[1]-bs[0]-1.2}" height="1.4" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".1" stroke-dasharray=".3 .25"/>`;
    if(lvls>1)g+=`<text x="${x0+w/2+ox}" y="${D+3.6}" text-anchor="middle" font-size=".95" fill="#dfe7ef" opacity=".8">${lv?"ALTA":"BAJA"}</text>`}
  g+=`<text x="${x0+(w*lvls+gap*(lvls-1))/2}" y="-2.6" text-anchor="middle" font-size=".95" fill="#dfe7ef" opacity=".75">FRENTE</text>`;
  T.set.f.forEach(([k,c],i)=>{const [fy,dx,lv=0]=mapPos(k),y=Math.max(-1,Math.min(D+.8,fy*D)),sp=spanAt(poly,Math.max(.01,Math.min(D-.01,y))),cx=(sp[0]+sp[1])/2,hw=(sp[1]-sp[0])/2-.7,x=cx+dx*inner*hw+lv*(w+gap),cur=i===T.i;
    g+=`<g class="dot${cur?" cur":""}" data-i="${i}"><title>${c}</title><circle cx="${x}" cy="${y}" r="${cur?.6:.42}"/>${cur?`<circle class="pulse" cx="${x}" cy="${y}" r=".6"/>`:""}<circle class="hit" cx="${x}" cy="${y}" r="1.3"/></g>`});
  m.innerHTML=`<svg viewBox="${vb}" role="img" aria-label="Plano del recorrido">${g}</svg><div class="cap">Esquema orientativo</div>`}
$("tMap").addEventListener("click",e=>{const d=e.target.closest(".dot");if(d)showPhoto(+d.dataset.i)});

/* ---------- visor 360° ---------- */
const PV={r:null};
function panoInit(){if(PV.r)return;const c=$("tPano");
  PV.r=new THREE.WebGLRenderer({canvas:c,antialias:false});PV.r.setPixelRatio(Math.min(devicePixelRatio||1,2));PV.r.outputEncoding=THREE.sRGBEncoding;
  PV.max=Math.min(PV.r.capabilities.maxTextureSize,4096);
  PV.scene=new THREE.Scene();PV.cam=new THREE.PerspectiveCamera(75,1,.1,1000);
  const g=new THREE.SphereGeometry(500,72,36);g.scale(-1,1,1);PV.mat=new THREE.MeshBasicMaterial({color:0x222222});PV.scene.add(new THREE.Mesh(g,PV.mat));
  PV.lon=0;PV.lat=0;PV.fov=75;PV.auto=true;PV.tl=new THREE.TextureLoader();
  let drag=null;const pts=new Map();
  c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX,y:e.clientY,lon:PV.lon,lat:PV.lat,d:null};PV.auto=false;$("tHint").style.opacity=0});
  c.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(drag.d)PV.fov=Math.max(35,Math.min(95,PV.fov*drag.d/d));drag.d=d;return}
    if(!drag)return;const k=PV.fov/c.clientHeight;PV.lon=drag.lon-(e.clientX-drag.x)*k;PV.lat=Math.max(-85,Math.min(85,drag.lat+(e.clientY-drag.y)*k))});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2&&drag)drag.d=null;if(!pts.size)drag=null};
  c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  c.addEventListener("wheel",e=>{e.preventDefault();PV.fov=Math.max(35,Math.min(95,PV.fov+e.deltaY*.04))},{passive:false});
  const tick=()=>{requestAnimationFrame(tick);if(!T.on||!c.classList.contains("on"))return;
    const w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*PV.r.getPixelRatio())||c.height!==Math.round(h*PV.r.getPixelRatio())){PV.r.setSize(w,h,false);PV.cam.aspect=w/h}
    if(PV.auto)PV.lon+=.03;const phi=THREE.MathUtils.degToRad(90-PV.lat),th=THREE.MathUtils.degToRad(PV.lon);
    PV.cam.fov=PV.fov;PV.cam.updateProjectionMatrix();PV.cam.lookAt(Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th));PV.r.render(PV.scene,PV.cam)};tick()}
function setTex(t){t.encoding=THREE.sRGBEncoding;t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;if(PV.mat.map&&PV.mat.map!==t)PV.mat.map.dispose();PV.mat.map=t;PV.mat.color.set(0xffffff);PV.mat.needsUpdate=true}
function loadPano(k,yaw){panoInit();const id=Symbol();PV.cur=id;PV.lon=yaw==null?180:yaw;PV.lat=0;PV.fov=innerWidth<760?85:75;PV.auto=!matchMedia("(prefers-reduced-motion: reduce)").matches;$("tHint").style.opacity=1;
  PV.tl.load(`img/360/${k}-s.jpg`,t=>{if(PV.cur!==id)return t.dispose();setTex(t);
    PV.tl.load(`img/360/${k}.jpg`,t2=>{if(PV.cur!==id)return t2.dispose();setTex(t2)})})}
