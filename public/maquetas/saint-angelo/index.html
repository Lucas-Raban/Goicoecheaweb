<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saint Angelo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(14,18,22,.78);--ink:#f3f6f8;--muted:#a7b3bc;--line:rgba(255,255,255,.12);--ok:#34c77b;--no:#e5484d;--sel:#f5d27a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#cfdbe6;color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.28)}
#side{position:fixed;top:16px;left:16px;bottom:16px;width:320px;padding:18px;display:flex;flex-direction:column;gap:12px;z-index:3;overflow:auto}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.addr{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.floors{display:grid;grid-template-columns:38px 1fr 1fr;gap:5px;align-items:center}
.floors .n{font-size:11px;color:var(--muted);text-align:right;padding-right:4px}
.u{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:9px;padding:8px 6px;font:inherit;font-size:12px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s,opacity .15s}
.u::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 6px 0 2px;vertical-align:1px;background:var(--no)}
.u.ok::before{background:var(--ok)}
.u.ok{border-color:rgba(52,199,123,.45);background:rgba(52,199,123,.12)}
.u.dim{opacity:.35}
.u[aria-pressed="true"]{border-color:var(--sel);background:rgba(245,210,122,.18)}
.card{border-top:1px solid var(--line);padding-top:12px;display:none}
.card .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card b{display:block;font-size:20px;margin:2px 0}
.card .meta{color:var(--muted);font-size:13px}
.card .price{font-size:22px;font-weight:700;margin-top:8px}
.card .price.no{font-size:15px;color:var(--muted);font-weight:500}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#25d366;color:#06240f;text-decoration:none;font-weight:600;border-radius:10px;padding:9px 12px;font-size:13px}
#tools{position:fixed;top:16px;right:16px;z-index:3;display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 370px)}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;padding:8px 11px;border-radius:10px;cursor:pointer}
.tb[aria-pressed="true"]{background:rgba(255,255,255,.16)}
#tip{position:fixed;z-index:4;pointer-events:none;padding:7px 10px;font-size:12px;display:none;white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#cfdbe6;color:#334;font-size:14px;transition:opacity .6s}
.hint{position:fixed;right:16px;bottom:16px;z-index:3;font-size:12px;color:var(--muted);padding:8px 12px}
#toggle{display:none}
@media (max-width:760px){
  #side{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:46%;padding:14px}
  #tools{left:8px;right:8px;top:8px;max-width:none;justify-content:center}
  .hint{display:none}h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cta.in{background:#fff;color:#111}
#tour{position:fixed;inset:0;z-index:10;background:#05080b;display:none;flex-direction:column;opacity:0;transition:opacity .5s}
#tour.on{display:flex}#tour.vis{opacity:1}
#tour .stage{position:relative;flex:1;overflow:hidden;min-height:0}
#tour .stage img,#tour .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#tour .stage #tBg{object-fit:cover;filter:blur(28px) brightness(.55);transform:scale(1.15)}
#tour .stage img{transition:opacity .45s}#tour .stage img.kb{animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
#tour .stage video{object-fit:contain;background:#000}
#tour .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 40px;background:linear-gradient(#000a,#0000);pointer-events:none}
#tour .bar>*{pointer-events:auto}
#tour .ttl .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9d3da}#tour .ttl b{display:block;font-size:22px}
#tour .ttl span{font-size:12px;color:#c9d3da}
#tour .tbtn{border:1px solid rgba(255,255,255,.3);background:rgba(10,14,18,.6);color:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
#tour .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#tour .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(10,14,18,.55);color:#fff;font-size:22px;cursor:pointer}
#tour .prev{left:14px}#tour .next{right:14px}
#tour .strip{display:flex;gap:8px;overflow-x:auto;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#0b1015;scrollbar-width:thin}
#tour .strip button{flex:0 0 auto;width:108px;border:2px solid transparent;border-radius:10px;padding:0;background:none;color:#cfd8de;font:inherit;font-size:11px;cursor:pointer;text-align:left;overflow:hidden}
#tour .strip button[aria-current="true"]{border-color:var(--sel)}
#tour .strip img{display:block;width:100%;height:64px;object-fit:cover}#tour .strip span{display:block;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tPano{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;cursor:grab}#tPano.on{display:block}#tPano:active{cursor:grabbing}
#tour .b360{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(10,14,18,.6);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;pointer-events:none;backdrop-filter:blur(8px);white-space:nowrap;transition:opacity .6s}
#fade{position:fixed;inset:0;z-index:9;background:#05080b;opacity:0;pointer-events:none;transition:opacity .45s}
@media (max-width:760px){#tour .ttl b{font-size:18px}#tour .nav{width:38px;height:38px}#tour .strip button{width:90px}}
@media (prefers-reduced-motion:reduce){#tour .stage img.kb{animation:none}}
</style></head><body>
<div id="fade"></div>
<div id="tour" role="dialog" aria-label="Recorrido del departamento"><div class="stage" id="tStage"><img id="tBg" alt=""><img id="tImg" class="kb" alt=""><canvas id="tPano"></canvas><div class="b360" id="tHint" hidden>360° · arrastrá para mirar alrededor</div><button class="nav prev" id="tPrev" aria-label="Anterior">‹</button><button class="nav next" id="tNext" aria-label="Siguiente">›</button>
<div class="bar"><div class="ttl" id="tTtl"></div><div class="acts"><button class="tbtn" id="tVid">▶ Video del recorrido</button><button class="tbtn" id="tOut">Salir al edificio</button></div></div></div>
<div class="strip" id="tStrip"></div></div>
<canvas id="c"></canvas>
<div id="loading">Cargando maqueta 3D…</div>
<aside id="side" class="glass">
  <div><div class="brand">Goicoechea Propiedades</div><h1>Saint Angelo</h1><div class="addr">Falucho 2740 · Mar del Plata</div></div>
  <div class="chips" id="filters"></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>Disponible</span><span><i style="background:var(--no)"></i>No disponible</span></div>
  <div class="floors" id="floors"></div>
  <div class="card" id="card"></div>
</aside>
<div id="tools" class="glass">
  <button class="tb" data-view="frente">Frente</button><button class="tb" data-view="aerea">Aérea</button><button class="tb" data-view="contra">Contrafrente</button><button class="tb" data-place="E">Entrada 360°</button><button class="tb" data-place="Q">Quincho 360°</button>
  <button class="tb" id="bDisp" aria-pressed="true">Disponibilidad</button><button class="tb" id="bSol">Atardecer</button><button class="tb" id="bRot" aria-pressed="true">Girar</button>
</div>
<div id="tip" class="glass"></div>
<div class="hint glass">Arrastrá para girar · pellizcá para acercar · tocá un piso</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
const $=id=>document.getElementById(id);
/* ---------- datos ---------- */
const WA="5492235111816";
const UNI=[[1,"A",98.81,3],[1,"B",70.79,2],[2,"A",98.58,3],[2,"B",70.88,2],[3,"A",98.33,3],[3,"B",70.97,2],[4,"A",98.63,3],[4,"B",71.43,2],[5,"A",98.62,3],[5,"B",70.74,2],[6,"A",98.98,3],[6,"B",71.29,2],[7,"A",98.98,3],[7,"B",71.29,2],[8,"A",98.98,3],[8,"B",71.41,2],[9,"A",124.40,4,"Dúplex"],[9,"B",122.26,4,"Dúplex"]];
const VENTA={"1B":140000,"2B":145000,"3A":210000,"5A":255000,"5B":155000,"7B":155000,"9A":270000};
const UNITS=UNI.map(([f,l,tot,amb,tag])=>({id:f+l,floor:f,l,tot,amb,tag,price:VENTA[f+l],ok:!!VENTA[f+l]}));
const OUT={A:[[0,0],[5.09,0],[5.09,8.04],[2.96,8.04],[2.96,11.58],[6.41,11.58],[6.41,16.86],[0,16.86]],B:[[5.09,0],[9.78,0],[9.78,16.86],[6.59,16.86],[6.59,11.58],[6.87,11.58],[6.87,8.04],[5.09,8.04]]};
const W=9.78,D=16.86,PB=4,FH=2.95,base=f=>PB+(f-1)*FH,TOP=base(11);
const S={sel:null,hover:null,amb:"all",onlyOk:false,disp:true,sunset:false,rot:true};
const fmt=n=>"USD "+n.toLocaleString("es-AR");
const match=u=>(S.amb==="all"||u.amb===+S.amb)&&(!S.onlyOk||u.ok);

/* ---------- UI ---------- */
function renderUI(){
  const ambs=[...new Set(UNITS.map(u=>u.amb))].sort();
  $("filters").innerHTML=`<button class="chip" data-amb="all" aria-pressed="${S.amb==="all"}">Todos</button>`+ambs.map(a=>`<button class="chip" data-amb="${a}" aria-pressed="${S.amb==a}">${a} amb</button>`).join("")+`<button class="chip" data-ok="1" aria-pressed="${S.onlyOk}">Solo disponibles</button>`;
  let h="";for(let f=9;f>=1;f--){h+=`<span class="n">${"Piso "+f}</span>`;for(const l of["A","B"]){const u=UNITS.find(x=>x.floor===f&&x.l===l);h+=`<button class="u ${u.ok?"ok":""} ${match(u)?"":"dim"}" data-u="${u.id}" aria-pressed="${S.sel===u.id}">${u.id} · ${u.amb} amb</button>`}}
  $("floors").innerHTML=h;
  const u=UNITS.find(x=>x.id===S.sel),c=$("card");
  if(!u){c.style.display="none";return}
  c.style.display="block";
  const txt=encodeURIComponent(`Hola, me interesa el depto ${u.id} de Saint Angelo (Falucho 2740).`);
  c.innerHTML=`<div class="k">Piso ${u.floor} · ${u.l==="A"?"Semipiso A":"Semipiso B"}</div><b>Depto ${u.id}</b><div class="meta">${u.amb} ambientes · ${u.tot} m² totales${u.tag?" · "+u.tag:""}</div>`+
    (u.ok?`<div class="price">${fmt(u.price)}</div>`:`<div class="price no">No disponible</div>`)+
    `<div style="display:flex;gap:8px;flex-wrap:wrap">`+(u.ok?`<button class="cta in" id="bIn" style="border:0;font:inherit;font-weight:600;cursor:pointer">Entrar al departamento</button>`:"")+(u.ok?`<a class="cta" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${txt}">Consultar por WhatsApp</a>`:"")+`</div>`;
}
$("side").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="bIn"){enterUnit(UNITS.find(x=>x.id===S.sel));return}
  if(t.dataset.u){select(S.sel===t.dataset.u?null:t.dataset.u,true)}
  else if(t.dataset.amb){S.amb=t.dataset.amb;refresh()}
  else if(t.dataset.ok){S.onlyOk=!S.onlyOk;refresh()}});
function refresh(){renderUI();paint()}

/* ---------- escena ---------- */
const canvas=$("c");
const R=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.78;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.physicallyCorrectLights=false;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(R);scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(32,1,.5,3000);
const ctl=new THREE.OrbitControls(cam,canvas);ctl.enableDamping=true;ctl.dampingFactor=.07;ctl.target.set(0,17,4);
ctl.minDistance=22;ctl.maxDistance=260;ctl.maxPolarAngle=THREE.MathUtils.degToRad(84);ctl.enablePan=true;ctl.screenSpacePanning=true;
ctl.autoRotate=true;ctl.autoRotateSpeed=.35;

// cielo con degradé
const skyU={top:{value:new THREE.Color("#6fa6dc")},mid:{value:new THREE.Color("#cfe2f1")},bot:{value:new THREE.Color("#eef2f3")}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyU,
  vertexShader:"varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:"uniform vec3 top,mid,bot;varying vec3 p;void main(){float h=p.y;vec3 c=h>0.?mix(mid,top,pow(clamp(h*1.6,0.,1.),.8)):bot;gl_FragColor=vec4(c,1.);}"}));
scene.add(sky);scene.fog=new THREE.Fog("#dfe8ee",160,900);

const hemi=new THREE.HemisphereLight("#dfeaff","#b8ab95",.55);scene.add(hemi);
const sun=new THREE.DirectionalLight("#fff3e0",2.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:10,far:400});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);
function setSun(sunset){S.sunset=sunset;$("bSol").setAttribute("aria-pressed",sunset);
  const az=sunset?THREE.MathUtils.degToRad(-58):THREE.MathUtils.degToRad(35),el=sunset?THREE.MathUtils.degToRad(14):THREE.MathUtils.degToRad(52);
  sun.position.set(Math.sin(az)*Math.cos(el)*200,Math.sin(el)*200,Math.cos(az)*Math.cos(el)*200);
  sun.color.set(sunset?"#ffb36b":"#fff1dc");sun.intensity=sunset?2.0:1.55;hemi.intensity=sunset?.28:.4;hemi.color.set(sunset?"#ffd7b0":"#dfeaff");
  skyU.top.value.set(sunset?"#46619a":"#6fa6dc");skyU.mid.value.set(sunset?"#f3b98a":"#cfe2f1");skyU.bot.value.set(sunset?"#f6d2b3":"#eef2f3");
  scene.fog.color.set(sunset?"#efcfb4":"#dfe8ee");R.toneMappingExposure=sunset?.85:.78;
  
}

const tl=new THREE.TextureLoader();
function photo(k,rx=1,ry=1){const t=tl.load(TEX[k]);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rx!==1||ry!==1){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry)}return t}
function noiseTex(base,amp,size=256){const c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d"),im=g.createImageData(size,size);
  for(let i=0;i<size*size;i++){const n=base+(Math.random()-.5)*amp;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=n;im.data[i*4+3]=255}g.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,12);return t}

const concrete=M("#b4b0a8",{roughness:.95,map:noiseTex(225,40)}),concreteDark=M("#6f6c67"),slabMat=M("#c9c4bb",{roughness:.8});

const asphalt=M("#3b3f45",{roughness:.95}),walk=M("#b9b3a8"),lawn=M("#6f8f55",{roughness:1}),path=M("#cfc6b3");
function box(w,h,d,mat,x,y,z,cast=true,recv=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=recv;return m}

/* fachada de vecinos: textura de ventanas generada */
const winMats=[];
function facadeTex(floors,cols,hue){const c=document.createElement("canvas");c.width=256;c.height=256;const g=c.getContext("2d");
  g.fillStyle=`hsl(${hue},12%,80%)`;g.fillRect(0,0,256,256);
  const fh=256/floors,cw=256/cols;
  for(let r=0;r<floors;r++)for(let k=0;k<cols;k++){g.fillStyle=Math.random()<.12?"#c9b48a":`hsl(205,${14+Math.random()*10}%,${32+Math.random()*12}%)`;g.fillRect(k*cw+cw*.18,r*fh+fh*.22,cw*.64,fh*.56)}
  g.fillStyle="rgba(0,0,0,.06)";for(let r=0;r<floors;r++)g.fillRect(0,r*fh,256,2);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function neighbor(x,z,w,d,floors,hue=35,ptex=null){const h=floors*3+1.2,g=new THREE.Group();
  const tex=facadeTex(floors,Math.max(2,Math.round(w/3)),hue),side=M(`hsl(${hue},8%,76%)`,{roughness:.95});
  const front=new THREE.MeshStandardMaterial({map:tex,roughness:.85,envMapIntensity:.3,emissive:"#000000",emissiveIntensity:0});winMats.push(front);if(ptex){front.map=ptex;front.color.set("#ffffff")}
  const mats=[side,side,M(`hsl(${hue},8%,80%)`),side,front,front];
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;g.add(m);
  g.add(box(w+.3,.5,d+.3,M(`hsl(${hue},8%,78%)`),x,h+.25,z));return g}

  PV.r=new THREE.WebGLRenderer({canvas:c,antialias:false});PV.r.setPixelRatio(Math.min(devicePixelRatio||1,2));PV.r.outputEncoding=THREE.sRGBEncoding;
  PV.max=Math.min(PV.r.capabilities.maxTextureSize,4096);
  PV.scene=new THREE.Scene();PV.cam=new THREE.PerspectiveCamera(75,1,.1,1000);
  const g=new THREE.SphereGeometry(500,72,36);g.scale(-1,1,1);PV.mat=new THREE.MeshBasicMaterial({color:0x222222});PV.scene.add(new THREE.Mesh(g,PV.mat));
  PV.lon=0;PV.lat=0;PV.fov=75;PV.auto=true;PV.tl=new THREE.TextureLoader();
  let drag=null;const pts=new Map();
  c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX,y:e.clientY,lon:PV.lon,lat:PV.lat,d:null};PV.auto=false;$("tHint").style.opacity=0});
  c.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(drag.d)PV.fov=Math.max(35,Math.min(95,PV.fov*drag.d/d));drag.d=d;return}
    if(!drag)return;const k=PV.fov/c.clientHeight;PV.lon=drag.lon-(e.clientX-drag.x)*k;PV.lat=Math.max(-85,Math.min(85,drag.lat+(e.clientY-drag.y)*k))});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2&&drag)drag.d=null;if(!pts.size)drag=null};
  c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  c.addEventListener("wheel",e=>{e.preventDefault();PV.fov=Math.max(35,Math.min(95,PV.fov+e.deltaY*.04))},{passive:false});
  const tick=()=>{requestAnimationFrame(tick);if(!T.on||!c.classList.contains("on"))return;
    const w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*PV.r.getPixelRatio())||c.height!==Math.round(h*PV.r.getPixelRatio())){PV.r.setSize(w,h,false);PV.cam.aspect=w/h}
    if(PV.auto)PV.lon+=.03;const phi=THREE.MathUtils.degToRad(90-PV.lat),th=THREE.MathUtils.degToRad(PV.lon);
    PV.cam.fov=PV.fov;PV.cam.updateProjectionMatrix();PV.cam.lookAt(Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th));PV.r.render(PV.scene,PV.cam)};tick()}
function setTex(t){t.encoding=THREE.sRGBEncoding;t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;if(PV.mat.map&&PV.mat.map!==t)PV.mat.map.dispose();PV.mat.map=t;PV.mat.color.set(0xffffff);PV.mat.needsUpdate=true}
function loadPano(k,yaw){panoInit();const id=Symbol();PV.cur=id;PV.lon=yaw==null?180:yaw;PV.lat=0;PV.fov=innerWidth<760?85:75;PV.auto=!matchMedia("(prefers-reduced-motion: reduce)").matches;$("tHint").style.opacity=1;
  PV.tl.load(`img/360/${k}-s.jpg`,t=>{if(PV.cur!==id)return t.dispose();setTex(t);
    PV.tl.load(`img/360/${k}.jpg`,t2=>{if(PV.cur!==id)return t2.dispose();setTex(t2)})})}
</script>
